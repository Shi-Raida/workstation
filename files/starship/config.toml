[aws]
style = "bold #ffb86c"

[character]
error_symbol = "[✗](bold #ff5555)"
success_symbol = "[➜](bold #50fa7b)"

[cmd_duration]
style = "bold #f1fa8c"

[directory]
style = "bold #50fa7b"

[git_branch]
style = "bold #ff79c6"

[git_status]
style = "bold #ff5555"

[hostname]
style = "bold #bd93f9"

[python]
symbol = " "

[username]
format = "[$user]($style) on "
style_user = "bold #8be9fd"

[custom.git_wip]
command = "~/.config/starship/git-wip-check.sh"
when = "~/.config/starship/git-wip-check.sh"
require_repo = true
symbol = "🚧"
format = "[$symbol $output]($style) "
style = "bold #f1fa8c"
description = "Shows WIP indicator when last commit is a work-in-progress"
